<!DOCTYPE html>
<!-- Starter code generated with Claude (Anthropic); modified by Aashira -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Air Drums</title>
<style>
  body{margin:0;background:#111;color:#eee;font-family:system-ui,sans-serif;text-align:center}
  #stage{position:relative;display:inline-block;margin-top:10px}
  video{width:min(95vw,720px);transform:scaleX(-1);border-radius:12px}
  canvas{position:absolute;left:0;top:0;width:100%;height:100%}
  button,input{font-size:1rem;padding:8px 14px;margin:6px;border-radius:8px;border:0}
  button{background:#000;color:#fff;border:2px solid #fff;cursor:pointer
button:hover{background:#222}}
</style>
</head>
<body>
<h1> Air Drums</h1>
<div>
  <input id="player" placeholder="Your name">
  <button id="start">Start</button>
  <button id="stop">Stop &amp; Save</button>
</div>
<div id="stage"><video id="v" autoplay playsinline muted></video><canvas id="c"></canvas></div>
<p id="msg">Press Start, allow the camera, and swing your hands down onto the circles.</p>
<script type="module">
import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

// Drum zones in normalized coordinates of the mirrored view
const ZONES = [
  {name:"hihat", x:.12, y:.50, r:.08, color:"#f9d71c"},
  {name:"snare", x:.30, y:.68, r:.10, color:"#4cc9f0"},
  {name:"tom1",  x:.38, y:.30, r:.08, color:"#f72585"},
  {name:"tom2",  x:.58, y:.30, r:.08, color:"#b5179e"},
  {name:"crash", x:.88, y:.22, r:.08, color:"#ff9f1c"},
  {name:"floor", x:.78, y:.65, r:.10, color:"#7bf1a8"},
  {name:"kick",  x:.54, y:.86, r:.09, color:"#ffffff"},
];
const SPEED = 0.5, COOLDOWN = 140;  // screen-heights/sec, ms

const v = document.getElementById("v"), cv = document.getElementById("c"), ctx = cv.getContext("2d");
const msg = document.getElementById("msg");
let audio, landmarker, running = false, hits = [], t0 = 0, flash = {};
const last = {};   // per-hand previous {y, time}
const cool = {};   // per-hand+zone cooldown

// ---------- Sounds (Web Audio synthesis) ----------
function noise(dur, hp){
  const b = audio.createBuffer(1, audio.sampleRate*dur, audio.sampleRate), d = b.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
  const s = audio.createBufferSource(); s.buffer = b;
  const f = audio.createBiquadFilter(); f.type = "highpass"; f.frequency.value = hp;
  s.connect(f); return {s, f};
}
function play(zone, vol){
  const now = audio.currentTime, g = audio.createGain(); g.connect(audio.destination);
  let dur = .2;
  if(zone==="snare"||zone==="hihat"||zone==="crash"){
    dur = zone==="hihat" ? .07 : zone==="crash" ? 1.0 : .18;
    const {s,f} = noise(dur, zone==="snare" ? 1500 : 6000); f.connect(g); s.start(now);
  }
  const PITCH = {snare:220, tom1:200, tom2:150, floor:110};
  if(PITCH[zone]){
    const o = audio.createOscillator(), og = audio.createGain(), f0 = PITCH[zone];
    o.frequency.setValueAtTime(f0*1.8, now); o.frequency.exponentialRampToValueAtTime(f0, now+.12);
    o.connect(og); og.connect(g); og.gain.value = zone==="snare" ? .4 : 1;
    o.start(now); o.stop(now+.4); dur = Math.max(dur, .35);
  }
  if(zone==="kick"){
    const o = audio.createOscillator(), og = audio.createGain();
    o.frequency.setValueAtTime(150, now); o.frequency.exponentialRampToValueAtTime(45, now+.15);
    o.connect(og); og.connect(g); og.gain.value = 1.4;
    o.start(now); o.stop(now+.4); dur = .35;
  }
  g.gain.setValueAtTime(vol, now);
  g.gain.exponentialRampToValueAtTime(.001, now+dur);
}

// ---------- Hit detection ----------
function detect(res, time){
  res.landmarks.forEach((lm, h) => {
    const tip = lm[8], x = 1 - tip.x, y = tip.y;       // mirror x
    const p = last[h];
    if(p){
      const vy = (y - p.y) / ((time - p.time)/1000);    // + = moving down
      for(const z of ZONES){
        const inside = Math.hypot((x-z.x)*cv.width/cv.height, y-z.y) < z.r;
        const key = h + z.name;
        if(inside && vy > SPEED && time - (cool[key]||0) > COOLDOWN){
          cool[key] = time;
          const vol = Math.min(1, .3 + vy/4);
          play(z.name, vol); flash[z.name] = time;
          hits.push({zone:z.name, t:Math.round(time - t0), v:+vy.toFixed(2)});
        }
      }
    }
    last[h] = {y, time};
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(x*cv.width, y*cv.height, 8, 0, 7); ctx.fill();
  });
}

function draw(time){
  ctx.clearRect(0,0,cv.width,cv.height);
  for(const z of ZONES){
    const on = time - (flash[z.name]||-1e9) < 120;
    ctx.beginPath(); ctx.arc(z.x*cv.width, z.y*cv.height, z.r*cv.height, 0, 7);
    ctx.lineWidth = 4; ctx.strokeStyle = z.color; ctx.stroke();
    if(on){ ctx.fillStyle = z.color+"99"; ctx.fill(); }
    ctx.fillStyle = "#fff"; ctx.font = "14px sans-serif"; ctx.textAlign = "center";
    ctx.fillText(z.name, z.x*cv.width, z.y*cv.height + 5);
  }
}

function loop(){
  if(!running) return;
  const time = performance.now();
  draw(time);
  if(v.readyState >= 2) detect(landmarker.detectForVideo(v, time), time);
  requestAnimationFrame(loop);
}
cv.addEventListener("click", e => {
  const r = cv.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
  for (const z of ZONES)
    if (Math.hypot((x - z.x) * cv.width / cv.height, y - z.y) < z.r) {
      play(z.name, 0.8); flash[z.name] = performance.now();
    }
});
// ---------- Buttons ----------
document.getElementById("start").onclick = async () => {
  audio = audio || new AudioContext();
  await audio.resume();
  msg.textContent = "Loading hand tracker…";
  if(!landmarker){
    const fs = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
    landmarker = await HandLandmarker.createFromOptions(fs, {
      baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task"},
      runningMode:"VIDEO", numHands:2
    });
  }
  v.srcObject = await navigator.mediaDevices.getUserMedia({video:{width:640,height:480}});
  await v.play();
  cv.width = v.videoWidth; cv.height = v.videoHeight;
  hits = []; t0 = performance.now(); running = true; msg.textContent = "Play!"; loop();
};

document.getElementById("stop").onclick = async () => {
  running = false;
  const r = await fetch("/api/session", {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({player: document.getElementById("player").value, hits})});
  const d = await r.json();
  msg.textContent = `Saved ${d.hits} hits | ${d.bpm} BPM | steadiness ${d.steadiness}%`;
};
</script>
</body>
</html>
